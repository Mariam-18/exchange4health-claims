<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 390" role="img" aria-labelledby="title desc">
<title id="title">Draft then check a claim</title>
<desc id="desc">Inputs are in blue above the horizontal claim workflow. The checker sends claims that pass to the payer and returns claims needing review to the agency.</desc>
